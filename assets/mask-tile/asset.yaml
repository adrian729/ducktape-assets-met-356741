# descriptive: find it and understand it
id: mask-tile
title: Rosselli mask frieze, one repeat
description: One repeat of the engraved frieze of masks and foliage, cut so the ends join seamlessly when stacked. A bearded mask in a beaded crown with a plume of acanthus leaves fills the lower half and a heart-shaped foliate cartouche with scrolling leaves the upper half, with a chain of small rosettes along the right edge; dark brown engraved lines over cream and tan interiors, the openings and the surrounding sheet transparent. Stored upright as on the sheet, so the masks lie on their side; the frieze reads upright when run horizontally.
type: border
