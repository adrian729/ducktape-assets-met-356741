# descriptive: find it and understand it
id: foliate-tile
title: Rosselli foliate border, one repeat
description: One repeat of the engraved vertical foliate ornament, cut so the top and bottom edges join seamlessly when stacked. A central lily-like palmette on a banded stem is flanked by mirrored acanthus leaves that curl outward into C-scrolls, with small berry sprigs at the two sides; dark brown engraved lines over cream and tan interiors, the openings between the leaves and the surrounding sheet transparent.
