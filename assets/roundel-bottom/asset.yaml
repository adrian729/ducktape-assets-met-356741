# descriptive: find it and understand it
id: roundel-bottom
title: Rosselli roundel, palmettes and inner ring
description: The engraved roundel from the lowest of the sheet's four square corner panels, cut to the circle without the panel's ruled square. Inside an egg-and-dart rim a central rosette sits in a fluted boss ringed by a second thin circle; acanthus palmettes with a bud reach out to the four cardinal points, and shell fans with small scrolling leaves fill the four diagonals; dark brown engraved lines over cream and tan interiors, the openings and the surrounding sheet transparent.
