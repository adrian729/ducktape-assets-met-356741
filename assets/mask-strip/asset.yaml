# descriptive: find it and understand it
id: mask-strip
title: Rosselli mask frieze
description: The complete engraved frieze from the right of the sheet, about five times longer than wide, stored upright as on the sheet so the masks lie on their side. Along its length four bearded masks in beaded crowns with plumes of acanthus leaves alternate with heart-shaped foliate cartouches and scrolling leaves, a fifth mask is cut off at the top end, and a chain of small rosettes runs along the right edge; both ends stop on cut foliage. Dark brown engraved lines over cream and tan interiors, the openings and the surrounding sheet transparent.
