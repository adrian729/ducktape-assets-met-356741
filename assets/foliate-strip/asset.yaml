# descriptive: find it and understand it
id: foliate-strip
title: Rosselli vertical foliate ornament
description: The complete engraved vertical ornament from the left of the sheet, about five times taller than wide. A central stem carries three lily-like palmettes on banded knots, flanked at every level by mirrored acanthus leaves that curl outward into C-scrolls and small berry sprigs; a small finial closes the top and the lowest leaves close the bottom. Dark brown engraved lines over cream and tan interiors, the openings between the leaves and the surrounding sheet transparent.
